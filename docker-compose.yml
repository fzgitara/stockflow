services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stockflow
      POSTGRES_USER: stockflow
      POSTGRES_PASSWORD: stockflow
    ports:
      - "5434:5432"   # host 5434 to avoid clashing with local dev Postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockflow -d stockflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/stockflow
      DB_USER: stockflow
      DB_PASSWORD: stockflow
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      TAX_RATE: ${TAX_RATE:-0.11}
      CORS_ORIGINS: http://localhost:4200
      SEED_ENABLED: ${SEED_ENABLED:-true}
    ports:
      - "8081:8080"   # host 8081 to avoid clashing with a locally running backend
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  db_data:
