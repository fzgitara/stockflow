spring:
  application:
    name: stockflow
  autoconfigure:
    # We authenticate via our own AuthService + JWT filter; no in-memory default user.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stockflow}
    username: ${DB_USER:stockflow}
    password: ${DB_PASSWORD:stockflow}
    # NOTE (dev machine): Homebrew postgresql@18 already binds 127.0.0.1:5432,
    # shadowing Docker's mapping. Run the container with -p 5433:5432 and set
    # DB_URL=jdbc:postgresql://localhost:5433/stockflow when running locally.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    whitelabel:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-dev-not-for-prod-change-me-in-dev-not-for-prod}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  tax-rate: ${TAX_RATE:0.11}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  seed:
    enabled: ${SEED_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.stockflow: DEBUG
